name: Build Windows

# Builds LessonPlanner.exe on a Windows runner.
# - Push a tag like v0.3.0 to publish it as a GitHub Release.
# - Or run it by hand from the Actions tab; the zip is then a downloadable artifact.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: jurplel/install-qt-action@v4
        with:
          version: "6.8.3"
          arch: win64_msvc2022_64
          cache: true

      - name: Configure
        run: cmake -S . -B build

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Package
        shell: pwsh
        run: |
          cmake --install build --config Release --prefix dist/LessonPlanner
          windeployqt --release --no-translations --no-compiler-runtime dist/LessonPlanner/LessonPlanner.exe
          Copy-Item README.md dist/LessonPlanner/

      - name: Smoke test
        shell: pwsh
        run: |
          $app = Start-Process dist/LessonPlanner/LessonPlanner.exe -ArgumentList "--smoke-test" -Wait -PassThru
          if ($app.ExitCode -ne 0) { throw "Smoke test failed with exit code $($app.ExitCode)" }

      - name: Zip
        shell: pwsh
        run: Compress-Archive -Path dist/LessonPlanner -DestinationPath LessonPlanner-windows.zip

      - uses: actions/upload-artifact@v7
        with:
          name: LessonPlanner-windows
          path: LessonPlanner-windows.zip

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          files: LessonPlanner-windows.zip
          generate_release_notes: true
